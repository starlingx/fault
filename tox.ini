[tox]
envlist = linters,pep8,pylint
minversion = 2.3
skipsdist = True
stxdir = {toxinidir}/../

[testenv]
usedevelop = False
basepython = python3
install_command = pip install \
    {opts} {packages}
setenv = VIRTUAL_ENV={envdir}
         OS_STDOUT_CAPTURE=1
         OS_STDERR_CAPTURE=1
         OS_TEST_TIMEOUT=60
deps = setuptools
       -r{toxinidir}/test-requirements-bullseye.txt

[coverage-deps]
deps = {[testenv]deps}
       pytest
       pytest-cov
       six
       iso8601
       oslo.utils
       oslo.log
       oslo.config
       oslo.i18n
       oslo.context
       oslo.policy
       oslo.concurrency
       oslo.db
       oslo.serialization
       oslo.versionedobjects
       oslo.service
       pecan
       WSME
       webob
       keystoneauth1
       keystonemiddleware
       stevedore
       pbr
       python-dateutil
       prettytable
       pyOpenSSL
       httplib2
       -e{toxinidir}/fm-api/source
       -e{toxinidir}/fm-rest-api/fm
       -e{toxinidir}/python-fmclient/fmclient

[trixie]
basepython = python3
setenv = {[testenv]setenv}
         UPPER_CONSTRAINTS_FILE=https://opendev.org/starlingx/root/raw/branch/master/build-tools/requirements/debian/trixie/upper-constraints.txt
install_command = pip install \
    -c{env:UPPER_CONSTRAINTS_FILE} \
    {opts} {packages}

[testenv:py39]
basepython = python3.9
install_command = pip install \
    -c{env:UPPER_CONSTRAINTS_FILE:https://opendev.org/starlingx/root/raw/branch/master/build-tools/requirements/debian/upper-constraints.txt} \
    {opts} {packages}

[testenv:linters]
basepython = python3
install_command = pip install {opts} {packages}
allowlist_externals = bash
commands =
  bash -c "find {toxinidir}          \
         -not \( -type d -name .?\* -prune \) \
         -type f                              \
         -not -name \*~                       \
         -not -name \*.md                     \
         \(                                   \
          -name \*.sh                         \
          -or -not -wholename \*/devstack/files/\* \
          -wholename \*/devstack/\*           \
         \)                                   \
         -print0 | xargs -0 bashate -v -iE006"
  bash -c "find {toxinidir}        \
            \( -name .tox -prune \)         \
            -o -type f -name '*.yaml'       \
            -print0 | xargs -0 yamllint -d '\{extends: relaxed, rules: \{line-length: \{max: 260\}\}\}'"
  bash -c "cd {envdir};  \
           cp {toxinidir}/fm-api/source/fm_api/constants.py .; \
           cp {toxinidir}/fm-common/sources/fmAlarm.h .; \
           cp {toxinidir}/fm-doc/fm_doc/* .; \
           ./checkEventYaml"

[testenv:pylint]
basepython = python3
install_command = pip install {opts} {packages}
sitepackages = True
deps = {[testenv]deps}
       -e{toxinidir}/../config/tsconfig/tsconfig
       -e{toxinidir}/../config/sysinv/cgts-client/cgts-client
       -r{toxinidir}/requirements.txt

commands = pylint {posargs} --rcfile=./pylint.rc \
               fm-api/source/fm_api \
               fm-common/sources/fm_db_sync_event_suppression.py \
               fm-rest-api/fm/fm  \
               python-fmclient/fmclient/fmclient

[testenv:pep8]
basepython = python3
install_command = pip install {opts} {packages}
description =
  Run style checks.
commands =
  flake8

[flake8]
# E117  over-indented
# E123, E125 skipped as they are invalid PEP-8
# E275  missing whitespace after keyword
# E402  module level import not at top of file
# E501  line too long (some code files include templates that end up wide)
# E741  ambiguous variable name
# F632  use ==/!= to compare constant literals
# F633  use of >> is invalid with print function
# F841  local variable is assigned to but never used
# H102  Apache 2.0 license header not found
# H104  File contains nothing but comments
# H105  Don't use author tags
# H216  The unittest.mock module should be used rather than third party mock
# H301  one import per line
# H306  imports not in alphabetical order
# H401  docstring should not start with a space
# H403  multi line docstrings should end on a new line
# H404  multi line docstring should start without a leading new line
# H405  multi line docstring summary not separated with an empty line
# H702  Argument to ... must be a string
# H903  Windows style line endings not allowed in code
# W504  line break after binary operator
# W605  invalid escape sequence
show-source = True
ignore = E117,E123,E125,E275,E402,E501,E741,F824,
         F632,F633,F841,
         H102,H104,H105,H216,H301,H306,H401,H403,H404,H405,H702,H903,
         W504,W605
exclude = .venv,.git,.tox,dist,doc,*lib/python*,*egg,build,release-tag-*
# TODO: H106 Do not put vim configuration in source files (off by default).
# H203 Use assertIs(Not)None to check for None (off by default).
# TODO: H904 Delay string interpolations at logging calls (off by default).
enable-extensions = H203

[testenv:venv]
basepython = python3
commands = {posargs}

[testenv:docs]
basepython = python3
deps = -r{toxinidir}/doc/requirements.txt
commands =
    rm -rf doc/build
    sphinx-build -a -E -W -d doc/build/doctrees -b html doc/source doc/build/html
allowlist_externals = rm

[testenv:releasenotes]
basepython = python3
deps = -r{toxinidir}/doc/requirements.txt
commands =
    rm -rf releasenotes/build
    sphinx-build -a -E -W -d releasenotes/build/doctrees -b html releasenotes/source releasenotes/build/html
allowlist_externals =
    rm
    reno

[testenv:newnote]
basepython = python3
# Re-use the releasenotes venv
envdir = {toxworkdir}/releasenotes
deps = -r{toxinidir}/doc/requirements.txt
commands = reno new {posargs}

[testenv:api-ref]
basepython = python3
deps =
    -r{toxinidir}/doc/requirements.txt
commands =
  rm -rf api-ref/build
  sphinx-build -W -b html -d api-ref/build/doctrees api-ref/source api-ref/build/html
allowlist_externals = rm

[testenv:build]
deps =
commands = {toxinidir}/devstack/build.sh

[testenv:functional]
basepython = python3
allowlist_externals = cat
commands = cat /etc/fm/fm.conf

[bandit]
# B101 assert_used
# B104 hardcoded_bind_all_interfaces
# B110 try_except_pass
# B324 hashlib
# B314 blacklist xml
# B506 yaml_load
skips = B101,B104,B110,B314,B324,B506
exclude=.tox,.eggs

[testenv:bandit]
basepython = python3
description = Bandit code scan for *.py files
deps = -r{toxinidir}/test-requirements-bullseye.txt
commands = bandit --ini tox.ini -r fm-api/source/fm_api \
            fm-common/sources/fm_db_sync_event_suppression.py \
            fm-rest-api/fm/fm  \
            python-fmclient/fmclient/fmclient

[testenv:coverage]
basepython = python3
sitepackages = True
install_command = pip install {opts} {packages}
setenv = {[testenv]setenv}
deps = {[coverage-deps]deps}
        setuptools<71
allowlist_externals = bash
                      mkdir
commands =
  mkdir -p {toxinidir}/UTCoverage
  bash -c "cd {toxinidir} && pytest tests/ \
    --cov=fm-api/source/fm_api \
    --cov=fm-common/sources \
    --cov=fm-doc/fm_doc \
    --cov=fm-rest-api/fm/fm \
    --cov=python-fmclient/fmclient/fmclient \
    --cov-report=term-missing \
    --cov-report=html:UTCoverage/htmlcov \
    --cov-report=xml:UTCoverage/coverage.xml \
    --cov-config=.coveragerc \
    -v --tb=short 2>&1 | tee UTCoverage/coverage_report.txt"

[testenv:coverage-c]
basepython = python3
allowlist_externals = bash
                      mkdir
                      which
                      gcc
                      g++
                      gcov
                      lcov
                      genhtml
commands =
  mkdir -p {toxinidir}/UTCoverage
  bash -c "if ! which g++ >/dev/null 2>&1; then \
    echo 'C++ toolchain not available - skipping C/C++ coverage' > {toxinidir}/UTCoverage/coverage-c_skipped.txt; \
    exit 0; \
  fi; \
  echo 'C/C++ source files found in fm-common/sources and fm-mgr/sources' > {toxinidir}/UTCoverage/coverage_c_report.txt; \
  echo 'C/C++ coverage requires full build environment with PostgreSQL and SNMP libraries' >> {toxinidir}/UTCoverage/coverage_c_report.txt; \
  echo 'Files: 19 .cpp files, 21 .h files' >> {toxinidir}/UTCoverage/coverage_c_report.txt; \
  echo 'Skipping compilation - missing build dependencies (libpq, net-snmp, libuuid)' >> {toxinidir}/UTCoverage/coverage_c_report.txt"

[testenv:linters-trixie]
basepython = {[trixie]basepython}
description = Run linters (Trixie)
deps = -r{toxinidir}/test-requirements-trixie.txt
setenv = {[trixie]setenv}
install_command = {[trixie]install_command}
allowlist_externals = {[testenv:linters]allowlist_externals}
commands = {[testenv:linters]commands}

[testenv:pep8-trixie]
basepython = {[trixie]basepython}
description = Run style checks (Trixie)
deps = flake8
setenv = {[trixie]setenv}
install_command = {[trixie]install_command}
# F824: unused-global - newer pyflakes 3.4 on Trixie detects unused global
# statements in existing source (fm-rest-api, python-fmclient)
commands = flake8 --extend-ignore=F824

[testenv:pylint-trixie]
basepython = {[trixie]basepython}
sitepackages = True
description = Run pylint (Trixie)
deps = -r{toxinidir}/test-requirements-trixie.txt
       -e{toxinidir}/../config/tsconfig/tsconfig
       -r{toxinidir}/requirements.txt
setenv = {[trixie]setenv}
install_command = {[trixie]install_command}
allowlist_externals = pip
commands_pre =
    pip install --no-deps -e{toxinidir}/../config/sysinv/cgts-client/cgts-client
# E1120: prettytable 3.x API changed (hrule parameter) - cgtsclient uses 0.7 API
commands = pylint {posargs} --rcfile=./pylint.rc --disable=E1120 \
               fm-api/source/fm_api \
               fm-common/sources/fm_db_sync_event_suppression.py \
               fm-rest-api/fm/fm \
               python-fmclient/fmclient/fmclient

[testenv:bandit-trixie]
basepython = {[trixie]basepython}
description = Bandit code scan (Trixie)
deps = -r{toxinidir}/test-requirements-trixie.txt
setenv = {[trixie]setenv}
install_command = {[trixie]install_command}
allowlist_externals = bandit
commands = {[testenv:bandit]commands}

[testenv:coverage-trixie]
basepython = {[trixie]basepython}
sitepackages = True
description = Run all tests with coverage analysis (Trixie)
deps = {[coverage-deps]deps}
setenv = {[trixie]setenv}
install_command = {[trixie]install_command}
allowlist_externals = {[testenv:coverage]allowlist_externals}
commands = {[testenv:coverage]commands}

[testenv:coverage-c-trixie]
basepython = {[trixie]basepython}
description = Run C/C++ coverage analysis (Trixie)
allowlist_externals = {[testenv:coverage-c]allowlist_externals}
commands = {[testenv:coverage-c]commands}